name: Manual Build All Platforms

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Build Description (optional)'
        required: false
        type: string
        default: 'Manual build'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (with R8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (with R8)
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon

      - name: Build Android Release AAB (with R8)
        run: |
          ./gradlew :composeApp:bundleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          retention-days: 90

  build-jvm-linux:
    name: Build JVM JAR (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JVM JAR (Linux)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon

      - name: Upload JAR (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jar-linux
          path: composeApp/build/compose/binaries/main-release/ubuntu/*.jar
          retention-days: 90

  build-jvm-windows:
    name: Build JVM JAR (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build JVM JAR (Windows)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon
        shell: bash

      - name: Upload JAR (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jar-windows
          path: composeApp/build/compose/binaries/main-release/windows/*.jar
          retention-days: 90

  build-jvm-macos:
    name: Build JVM JAR (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JVM JAR (macOS)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon

      - name: Upload JAR (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jar-macos
          path: composeApp/build/compose/binaries/main-release/macos/*.jar
          retention-days: 90

  summary:
    name: Build Summary
    needs: [build-android, build-jvm-linux, build-jvm-windows, build-jvm-macos]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate build summary
        run: |
          echo "# 🎉 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "| Android | APK, AAB | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android | APK, AAB | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-linux.result }}" == "success" ]; then
            echo "| JVM (Linux) | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (Linux) | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-windows.result }}" == "success" ]; then
            echo "| JVM (Windows) | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (Windows) | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-macos.result }}" == "success" ]; then
            echo "| JVM (macOS) | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (macOS) | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Build Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Description:** ${{ github.event.inputs.build_description }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **R8:** ✅ Enabled for Android" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
