name: Manual Build All Platforms

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Build Description (optional)'
        required: false
        type: string
        default: 'Manual build'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (with R8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (with R8)
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 90

  build-jvm-windows-x86:
    name: Build JVM JAR (Windows x86)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build JVM JAR (Windows x86)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon
        shell: bash

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: composeApp/build/compose/jars/*.jar
          retention-days: 90
          if-no-files-found: warn

  build-jvm-windows-x64:
    name: Build JVM JAR (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build JVM JAR (Windows x64)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon
        shell: bash

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: composeApp/build/compose/jars/*.jar
          retention-days: 90
          if-no-files-found: warn

  build-jvm-linux-x86:
    name: Build JVM JAR (Linux x86)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JVM JAR (Linux x86)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: composeApp/build/compose/jars/*.jar
          retention-days: 90
          if-no-files-found: warn

  build-jvm-linux-x64:
    name: Build JVM JAR (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JVM JAR (Linux x64)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: composeApp/build/compose/jars/*.jar
          retention-days: 90
          if-no-files-found: warn

  build-jvm-macos-x64:
    name: Build JVM JAR (macOS x64)
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JVM JAR (macOS x64)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: composeApp/build/compose/jars/*.jar
          retention-days: 90
          if-no-files-found: warn

  build-jvm-macos-arm64:
    name: Build JVM JAR (macOS ARM64)
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JVM JAR (macOS ARM64)
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS \
            --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: composeApp/build/compose/jars/*.jar
          retention-days: 90
          if-no-files-found: warn

  summary:
    name: Build Summary
    needs: [
      build-android, 
      build-jvm-windows-x86, 
      build-jvm-windows-x64, 
      build-jvm-linux-x86, 
      build-jvm-linux-x64, 
      build-jvm-macos-x64, 
      build-jvm-macos-arm64
    ]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate build summary
        run: |
          echo "# 🎉 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "| Android | - | APK | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android | - | APK | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-windows-x86.result }}" == "success" ]; then
            echo "| JVM (Windows) | x86 | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (Windows) | x86 | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-windows-x64.result }}" == "success" ]; then
            echo "| JVM (Windows) | x64 | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (Windows) | x64 | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-linux-x86.result }}" == "success" ]; then
            echo "| JVM (Linux) | x86 | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (Linux) | x86 | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-linux-x64.result }}" == "success" ]; then
            echo "| JVM (Linux) | x64 | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (Linux) | x64 | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-macos-x64.result }}" == "success" ]; then
            echo "| JVM (macOS) | x64 | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (macOS) | x64 | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-jvm-macos-arm64.result }}" == "success" ]; then
            echo "| JVM (macOS) | ARM64 | JAR | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JVM (macOS) | ARM64 | JAR | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Build Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Description:** ${{ github.event.inputs.build_description }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **R8:** ✅ Enabled for Android" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
